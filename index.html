<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廠商處理紀錄管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-responsive { max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="mb-4 text-center text-primary">廠商處理紀錄管理系統</h1>
        
        <div class="row">
            <!-- 左側輸入表單 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white"><h4>1. 紀錄輸入表單</h4></div>
                    <div class="card-body">
                        <form id="vendorForm">
                            <div class="mb-3">
                                <label class="form-label">1. 廠商名稱 (必填):</label>
                                <input type="text" id="vendor" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">2. 電:</label>
                                <input type="text" id="electric" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">3. 銅條距離:</label>
                                <input type="text" id="distance" class="form-control">
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label">3-1. 平孔數量:</label>
                                    <input type="number" id="flat_holes" class="form-control" value="0">
                                </div>
                                <div class="col">
                                    <label class="form-label">3-2. ㄇ孔數量:</label>
                                    <input type="number" id="m_holes" class="form-control" value="0">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">4. 備注:</label>
                                <textarea id="note" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label">5. 電板 (片):</label>
                                    <input type="number" id="plate_qty" class="form-control" value="0">
                                </div>
                                <div class="col">
                                    <label class="form-label">6. 時間 (分):</label>
                                    <input type="number" id="time_spent" class="form-control" value="0">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label">7-1. 一次 (支):</label>
                                    <input type="number" id="once_qty" class="form-control" value="0">
                                </div>
                                <div class="col">
                                    <label class="form-label">7-2. 一支 (個):</label>
                                    <input type="number" id="one_to_each_qty" class="form-control" value="0">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">8. 拍照備註:</label>
                                <input type="text" id="photo_note" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-success w-100">儲存 / 更新紀錄</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 右側控制台與搜尋 -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white"><h4>2. 操作控制台</h4></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">搜尋 / 刪除名稱:</label>
                            <input type="text" id="search_query" class="form-control" placeholder="輸入廠商名稱...">
                        </div>
                        <div class="d-flex gap-2 mb-3">
                            <button onclick="searchVendor()" class="btn btn-info text-white flex-grow-1">搜尋廠商</button>
                            <button onclick="deleteVendor()" class="btn btn-danger flex-grow-1">刪除廠商</button>
                            <button onclick="clearSearch()" class="btn btn-secondary">重設搜尋</button>
                        </div>
                        <div class="d-flex gap-2">
                            <button onclick="exportToCSV()" class="btn btn-warning w-100">匯出 CSV 檔案</button>
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">資料顯示區</h5>
                        <span class="badge bg-secondary" id="total_count">總筆數: 0</span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover table-bordered align-middle text-center" id="resultTable">
                                <thead class="table-dark">
                                    <tr>
                                        <th>廠商</th><th>電</th><th>銅條距離</th><th>平孔</th><th>ㄇ孔</th><th>備注</th><th>電板</th><th>時間</th><th>一次</th><th>一支</th><th>拍照</th><th>更新時間</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <!-- 資料動態插入 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('vendor_db')) || [];

        document.getElementById('vendorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const vendorName = document.getElementById('vendor').value.trim();
            if(!vendorName) return;

            const newData = {
                vendor: vendorName,
                electric: document.getElementById('electric').value,
                distance: document.getElementById('distance').value,
                flat_holes: document.getElementById('flat_holes').value,
                m_holes: document.getElementById('m_holes').value,
                note: document.getElementById('note').value,
                plate_qty: document.getElementById('plate_qty').value,
                time_spent: document.getElementById('time_spent').value,
                once_qty: document.getElementById('once_qty').value,
                one_to_each_qty: document.getElementById('one_to_each_qty').value,
                photo_note: document.getElementById('photo_note').value,
                update_time: new Date().toLocaleString()
            };

            // 移除舊有同名廠商進行更新
            db = db.filter(item => item.vendor !== vendorName);
            db.push(newData);
            saveToLocalStorage();
            renderTable(db);
            document.getElementById('vendorForm').reset();
            alert('儲存成功！');
        });

        function saveToLocalStorage() {
            localStorage.setItem('vendor_db', JSON.stringify(db));
        }

        function renderTable(dataList) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            document.getElementById('total_count').innerText = `總筆數: ${dataList.length}`;
            
            if(dataList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12">暫無資料</td></tr>';
                return;
            }

            dataList.forEach(item => {
                const row = `<tr>
                    <td><b>${item.vendor}</b></td>
                    <td>${item.electric}</td>
                    <td>${item.distance}</td>
                    <td>${item.flat_holes}</td>
                    <td>${item.m_holes}</td>
                    <td>${item.note}</td>
                    <td>${item.plate_qty}</td>
                    <td>${item.time_spent}</td>
                    <td>${item.once_qty}</td>
                    <td>${item.one_to_each_qty}</td>
                    <td>${item.photo_note}</td>
                    <td><small>${item.update_time}</small></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function searchVendor() {
            const query = document.getElementById('search_query').value.trim();
            if(!query) {
                renderTable(db);
                return;
            }
            const filtered = db.filter(item => item.vendor.includes(query));
            renderTable(filtered);
        }

        function clearSearch() {
            document.getElementById('search_query').value = '';
            renderTable(db);
        }

        function deleteVendor() {
            const query = document.getElementById('search_query').value.trim();
            if(!query) {
                alert('請先在搜尋欄輸入要刪除的廠商精確名稱！');
                return;
            }
            const exists = db.some(item => item.vendor === query);
            if(exists) {
                if(confirm(`確定要刪除廠商「${query}」的紀錄嗎？`)) {
                    db = db.filter(item => item.vendor !== query);
                    saveToLocalStorage();
                    renderTable(db);
                    document.getElementById('search_query').value = '';
                    alert('刪除成功！');
                }
            } else {
                alert(`找不到名為 「${query}」 的廠商。`);
            }
        }

        function exportToCSV() {
            if(db.length === 0) {
                alert('目前無資料可匯出！');
                return;
            }
            let csvContent = "﻿廠商,電,銅條距離,平孔數量,ㄇ孔數量,備注,電板(片),時間(分),一次(支),一支(個),拍照備註,更新時間
";
            db.forEach(item => {
                csvContent += `"${item.vendor}","${item.electric}","${item.distance}","${item.flat_holes}","${item.m_holes}","${item.note}","${item.plate_qty}","${item.time_spent}","${item.once_qty}","${item.one_to_each_qty}","${item.photo_note}","${item.update_time}"
`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "廠商處理紀錄備份.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 網頁載入時自動初始化資料表
        renderTable(db);
    </script>
</body>
</html>
